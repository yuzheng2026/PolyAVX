name: Stale Issue Management

on:
  schedule:
    - cron: '0 0 * * 0'   # 每周日午夜运行
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: '这个 Issue 已经 30 天没有活动了，如果仍需关注，请回复，否则 7 天后将自动关闭。'
          close-issue-message: '由于长时间未活动，此 Issue 已自动关闭。如有需要，可重新打开。'
          exempt-issue-labels: 'good first issue,help wanted,documentation'
