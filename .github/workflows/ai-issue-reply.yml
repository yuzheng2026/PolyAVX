name: AI Issue Reply

on:
  issues:
    types: [opened]

jobs:
  ai-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Call DeepSeek API
        id: ai
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          
          # 构造发送给 AI 的提示词
          PROMPT="你是一个开源项目的维护者助手。有人提了以下 Issue，请用中文简要回复：\n\n标题：${ISSUE_TITLE}\n\n内容：${ISSUE_BODY}\n\n请给出友好、有帮助的回复。"
          
          # 转义 JSON
          PROMPT_JSON=$(jq -nc --arg content "$PROMPT" '{
            "model": "deepseek-chat",
            "messages": [{"role": "user", "content": $content}]
          }')
          
          # 调用 DeepSeek API
          RESPONSE=$(curl -s https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEKV4PRO_API_KEY }}" \
            -d "$PROMPT_JSON")
          
          # 提取回复内容
          REPLY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "reply=$REPLY" >> $GITHUB_OUTPUT
      
      - name: Post reply
        uses: actions/github-script@v7
        with:
          script: |
            const reply = `${{ steps.ai.outputs.reply }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reply
            });
