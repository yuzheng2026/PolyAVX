name: AI PR Review (Qwen)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
      - name: Call Qwen API
        id: ai
        run: |
          DIFF_CONTENT=$(cat diff.txt)
          # 限制diff长度，避免超token
          DIFF_CONTENT=$(echo "$DIFF_CONTENT" | head -c 3000)
          PROMPT="请审查以下C++代码变更，用中文简要指出潜在问题、改进建议和安全风险：\n\n${DIFF_CONTENT}"
          
          RESPONSE=$(curl -s "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.QWEN_API_KEY }}" \
            -d "{
              \"model\": \"qwen-turbo\",
              \"input\": {
                \"messages\": [
                  {\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}
                ]
              },
              \"parameters\": {
                \"result_format\": \"message\"
              }
            }")
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.output.choices[0].message.content // "无法生成审查意见。"')
          echo "review=$REVIEW" >> $GITHUB_OUTPUT
      
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.ai.outputs.review }}`;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: review,
              event: 'COMMENT'
            });
